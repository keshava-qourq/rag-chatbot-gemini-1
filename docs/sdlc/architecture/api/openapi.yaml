components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - created_at
    auth_sessions:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - expires_at
    documents:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        file_type:
          type: string
        size_bytes:
          type: string
        s3_key:
          type: string
        status:
          type: string
        failure_reason:
          type: string
        ingest_attempt:
          type: integer
        job_id:
          type: string
        heartbeat_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - title
      - file_type
      - size_bytes
      - s3_key
      - status
      - ingest_attempt
      - created_at
    chunks:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        page_number:
          type: integer
        location_marker:
          type: string
        ordinal:
          type: integer
        ingest_attempt:
          type: integer
        text:
          type: string
        embedding:
          type: string
      required:
      - id
      - user_id
      - document_id
      - ordinal
      - ingest_attempt
      - text
    chat_sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        last_message_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - title
    chat_session_documents:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
      required:
      - session_id
      - document_id
    messages:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
        content:
          type: string
        answer_type:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - session_id
      - role
      - content
      - created_at
    citations:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_title:
          type: string
        page_number:
          type: integer
        location_marker:
          type: string
        position:
          type: integer
      required:
      - id
      - message_id
      - document_title
      - position
